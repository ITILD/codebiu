# Casbin Domain-Separated RBAC 模型配置(与 Python 侧 rbac_model.conf 原样一致)
# 参考文档：https://casbin.org/docs/rbac-with-domains

# Request definition
# 请求定义：[请求者, 请求的域, 请求的资源, 请求的动作]
[request_definition]
r = sub, dom, obj, act

# Policy definition
# 策略定义：[策略规则的组成部分]
[policy_definition]
p = sub, dom, obj, act

# Role definition
# 角色定义：g = 用户/角色, 角色, 域(支持域级别的权限隔离)
# 特殊域 "*" 表示全局角色，系统管理员使用全局角色实现跨域权限
[role_definition]
g = _, _, _

# Policy effect
# 当至少有一条策略规则匹配并且结果为 allow 时，请求就被允许
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# 1. 角色匹配：请求域或全局域("*")命中
# 2. 域匹配：精确匹配 / 全局域 / 子域匹配(keyMatch)
# 3. 资源/动作匹配：精确匹配或通配
[matchers]
m = (g(r.sub, p.sub, r.dom) || g(r.sub, p.sub, "*")) && (r.dom == p.dom || p.dom == "*" || keyMatch(r.dom, p.dom + "/*")) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
