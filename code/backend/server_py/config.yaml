# ############################# 配置分层规范(基线工程) #############################
# 加载层级(低 → 高, 后层覆盖前层, 嵌套 dict 深合并, list 整体替换):
#   1. config.yaml        基线层(本文件, 入 git): 引导级配置 + 通用默认值, 开箱即用
#   2. config.seed.yaml   约定种子层(gitignored, 存在即加载): 业务配置/模型种子的首启录入来源
#   3. APP_ENV 环境覆盖层  环境切换标准姿势: .env 写 APP_ENV=dev → 自动加载 config.dev.yaml
#   4. CONFIG_PATH 环境变量 部署覆盖层(逗号分隔多文件按序覆盖, 生产/CI 注入, 缺失即启动失败)
#   5. CODEBIU_* 环境变量  键级覆盖最高优先级(嵌套键用双下划线):
#                         CODEBIU_TOKEN__SECRET_KEY=xxx → token.secret_key
# 环境声明: 项目根 .env(gitignored)自动加载, 真实环境变量优先于 .env
# 密钥管理: 一切密钥只放 gitignored 覆盖层(config.seed.yaml / config.*.yaml / .secrets.*)
#           或环境变量, 严禁写入本文件。
# 业务配置(token/email/websearch/file_system/db_cache/db_vector/db_graph/tasks 九组):
#   yaml 种子只放 config.seed.yaml; 无种子时以 schema 默认值兜底
#   (common/config/dynamic/schemas.py, 字段文档即通用配置页表单), 首启入库后以
#   系统管理→通用配置页 为准; 默认管理员 admin 属通用基线配置, 归本文件而非种子文件。
# 典型用法:
#   开发: .env 写 APP_ENV=dev
#   发布: 容器 ENV APP_ENV=prod → 外挂 config.prod.yaml; 密钥走 CODEBIU_*/K8s Secret

# ############################# 全局标识 #############################
global:
  # 应用名称
  name: codebiu
  # 应用版本
  version: 0.0.1

# ############################# 状态配置 #############################
state:
  is_dev: true
  # 数据库自检,rel创建基础表
  # check_db: true

# ############################# 后端服务配置 #############################
server:
  # 根路由代理
  server_root_path: ""
  host: 0.0.0.0
  port: 2001

# 中间件配置
# 【保留 yaml】引导级配置(app 构建期读取, 早于数据库可用)
middleware:
  cors: true
  gzip: true

# 出网代理(可选, 不配直连): proxy: {type: http, host: 127.0.0.1, port: 18081}

# ############################# 目录配置 #############################
dir:
  # 基础根目录
  base: temp_source
  # 子目录定义（按功能划分）
  base_child:
    source:     source      # 源代码/原始文件
    upload:     upload      # 用户上传文件(默认目录)
    log:        log         # 日志文件
    sys_out:    sys_out     # 系统输出（如运行结果、导出文件）
    temp:       temp        # 临时文件(解压缩之类)
    db:         db          # 数据库文件（如 SQLite、缓存等）
    test:       test        # 测试相关资源
    model:      model       # 模型文件
    lib_third:  lib_third   # 第三方库文件
  # 静态资源目录
  public: public

# ############################# 数据库配置 #############################
# db_rel 保持 yaml(引导级: 动态配置中心本身依赖它, 无法动态化);
# 缓存/向量/图数据库属动态配置组, yaml 种子放 config.seed.yaml
db_rel:
  type: sqlite
  database: temp_source\db\data.db

# ############################# 系统管理员账户配置 #############################
# 【基线配置】默认管理员属通用引导账户(非环境敏感), 归本文件而非种子文件:
# 作为 admin 组首启种子入库, 之后可在 系统管理→通用配置页 修改
admin:
  username: admin
  password: admin123
  nickname: 系统管理员
  email: admin@codebiu.local
  # 每次启动都将密码重置为上方配置值(忘记密码时改为 true 重启即可恢复)
  reset_password: false