[[tool.uv.index]]# uv的索引
# 清华源
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# 阿里源
# url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
# 格式化规则
line-length = 100

[tool.ruff.lint.per-file-ignores]# ruff校验规则
# 起始函数验证规则排除
"app.py" = ["F401"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # 可选值："auto", "strict", "off"
# session 级 loop: lifespan(连接池)/测试同 loop,避免 asyncpg 跨 loop 崩溃
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
# ; 设置输出
# importlib 导入模式: 允许不同目录存在同名测试文件(如两处 test_db.py)而不冲突
addopts = "-v -s --log-cli-level=WARNING --import-mode=importlib"


