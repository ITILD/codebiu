# Casbin Domain-Separated RBAC 模型配置
# 参考文档：https://casbin.org/docs/rbac-with-domains
# https://blog.csdn.net/weixin_51999615/article/details/123696937

# Request definition
# 请求定义：[请求者, 请求的域, 请求的资源, 请求的动作]
# sub: 请求主体（用户或角色）
# dom: 逻辑隔离域（Domain），用于实现多租户或部门级别的权限隔离
#      特殊值 "*" 表示全局域，系统管理员使用此域实现全局权限穿透
# obj: 请求访问的资源
# act: 请求执行的操作
[request_definition]
r = sub, dom, obj, act

# Policy definition
# 策略定义：[策略规则的组成部分]
# sub: 策略主体（用户或角色）
# dom: 策略所属的域，"*" 表示全局域
# obj: 策略控制的资源
# act: 策略允许的操作
[policy_definition]
p = sub, dom, obj, act

# Role definition
# 角色定义：g 是角色继承关系，支持域级别的权限隔离
# g = _, _, _  格式为：g = 用户/角色, 角色,（实为 sub, role, dom）
# 表示在指定域中，前面的用户/角色继承了后面角色的权限
# 同一用户在不同域中可以拥有不同的角色
# 特殊域 "*" 表示全局角色，系统管理员使用全局角色实现跨域权限
[role_definition]
g = _, _, _

# Policy effect
# 策略效果：当至少有一条策略规则匹配并且结果为 allow 时，请求就被允许
[policy_effect]
e = some(where (p.eft == allow))

# Matchers
# 匹配器：定义如何匹配请求和策略
# 域内角色匹配：g(r.sub, p.sub, r.dom) && r.dom == p.dom
# r.obj == p.obj：请求的资源与策略中的资源匹配
# r.act == p.act：请求的动作与策略中的动作匹配
[matchers]
# 最纯粹的域隔离匹配，享受 Casbin 最高性能缓存
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
