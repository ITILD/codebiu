server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;


    root /usr/share/nginx/html/index;
    index index.html;

    client_header_timeout 30s;      # 请求头一般很小，保持较短即可

    location / {
        try_files $uri $uri/ /index.html;
    }

    
    location /base_server/ {
        client_max_body_size 100m;
        proxy_buffering off;          # 关闭缓冲，确保流式实时推送
        proxy_cache off;              # 禁止缓存流式响应
        chunked_transfer_encoding on; # 支持分块传输
        # --- 超时设置 ---
        proxy_connect_timeout 30s;      # 连接后端超时，30s 足够
        proxy_send_timeout    300s;     # 上传大文件/长请求体时适当延长
        proxy_read_timeout    300s;     # ⭐ RAG 核心：根据实际推理耗时调整，建议 3-5 分钟
        client_body_timeout   300s;     # 配合 100m 上传，避免客户端慢传超时

        
        proxy_pass http://rag_server:8600/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}